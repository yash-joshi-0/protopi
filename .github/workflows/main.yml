name: Commit Comment

on:
  workflow_call:
    inputs:
      repository:
        description: The full name of the target repository.
        required: false
        type: string
      sha:
        description: The commit SHA.
        required: false
        type: string
      path:
        description: Relative path of the file to comment on.
        required: false
        type: string
      position:
        description: Line index in the diff to comment on.
        required: false
        type: string
      comment-id:
        description: The id of the comment to update.
        required: false
        type: string
      body:
        description: The comment body.
        required: false
        type: string
      body-path:
        description: The path to a file containing the comment body.
        required: false
        type: string
      edit-mode:
        description: The mode when updating a comment, "replace" or "append".
        required: false
        type: string
        default: append
      append-separator:
        description: The separator to use when appending to an existing comment.
        required: false
        type: string
        default: newline
      reactions:
        description: A comma or newline separated list of reactions to add to the comment.
        required: false
        type: string
      reactions-edit-mode:
        description: The mode when updating comment reactions, "replace" or "append".
        required: false
        type: string
        default: append
    secrets:
      token:
        description: GitHub token used to create the comment.
        required: false
  workflow_dispatch:
    inputs:
      commit_choice:
        description: Select a recent commit to comment on. The label includes part of the commit message.
        required: true
        type: choice
        default: f3bcd45 - Workflow fixes
        options:
          - f3bcd45 - Workflow fixes
          - 080477d - SPI1 fix 3: I am doing it again
          - d825b89 - SPI1 fix 3: I am doing it again
          - c81a07e - SPI1 fix 2
      sha:
        description: Optional custom commit SHA. Leave blank to use the selected commit above.
        required: false
        type: string
      body:
        description: The comment body.
        required: false
        default: Thanks for the update!
        type: string
      repository:
        description: The full name of the target repository.
        required: false
        type: string
      path:
        description: Relative path of the file to comment on.
        required: false
        type: string
      position:
        description: Line index in the diff to comment on.
        required: false
        type: string
      comment-id:
        description: The id of the comment to update.
        required: false
        type: string
      edit-mode:
        description: The mode when updating a comment, "replace" or "append".
        required: false
        type: choice
        default: append
        options:
          - append
          - replace
      reactions:
        description: A comma or newline separated list of reactions to add to the comment.
        required: false
        type: string
      reactions-edit-mode:
        description: The mode when updating comment reactions, "replace" or "append".
        required: false
        type: choice
        default: append
        options:
          - append
          - replace

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve selected commit
        if: github.event_name == 'workflow_dispatch'
        id: resolve_commit
        shell: bash
        run: |
          # Use explicit custom SHA if provided
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          choice="${{ github.event.inputs.commit_choice }}"
          case "$choice" in
            "f3bcd45 - Workflow fixes")
              echo "sha=f3bcd45" >> "$GITHUB_OUTPUT"
              ;;
            "080477d - SPI1 fix 3: I am doing it again")
              echo "sha=080477d" >> "$GITHUB_OUTPUT"
              ;;
            "d825b89 - SPI1 fix 3: I am doing it again")
              echo "sha=d825b89" >> "$GITHUB_OUTPUT"
              ;;
            "c81a07e - SPI1 fix 2")
              echo "sha=c81a07e" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not resolve a commit SHA from choice: $choice"
              exit 1
              ;;
          esac

      - name: Set inputs as env vars
        id: set_inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "resolved_sha=${{ steps.resolve_commit.outputs.sha }}" >> "$GITHUB_OUTPUT"
            echo "resolved_repository=${{ github.event.inputs.repository || github.repository }}" >> "$GITHUB_OUTPUT"
            echo "resolved_path=${{ github.event.inputs.path }}" >> "$GITHUB_OUTPUT"
            echo "resolved_position=${{ github.event.inputs.position }}" >> "$GITHUB_OUTPUT"
            echo "resolved_comment_id=${{ github.event.inputs.comment-id }}" >> "$GITHUB_OUTPUT"
            echo "resolved_body=${{ github.event.inputs.body }}" >> "$GITHUB_OUTPUT"
            echo "resolved_edit_mode=${{ github.event.inputs.edit-mode }}" >> "$GITHUB_OUTPUT"
            echo "resolved_reactions=${{ github.event.inputs.reactions }}" >> "$GITHUB_OUTPUT"
            echo "resolved_reactions_edit_mode=${{ github.event.inputs.reactions-edit-mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "resolved_sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
            echo "resolved_repository=${{ inputs.repository || github.repository }}" >> "$GITHUB_OUTPUT"
            echo "resolved_path=${{ inputs.path }}" >> "$GITHUB_OUTPUT"
            echo "resolved_position=${{ inputs.position }}" >> "$GITHUB_OUTPUT"
            echo "resolved_comment_id=${{ inputs.comment-id }}" >> "$GITHUB_OUTPUT"
            echo "resolved_body=${{ inputs.body }}" >> "$GITHUB_OUTPUT"
            echo "resolved_edit_mode=${{ inputs.edit-mode }}" >> "$GITHUB_OUTPUT"
            echo "resolved_reactions=${{ inputs.reactions }}" >> "$GITHUB_OUTPUT"
            echo "resolved_reactions_edit_mode=${{ inputs.reactions-edit-mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Comment
        uses: peter-evans/commit-comment@v4.0.0
        with:
          token: ${{ secrets.token != '' && secrets.token || github.token }}
          repository: ${{ steps.set_inputs.outputs.resolved_repository }}
          sha: ${{ steps.set_inputs.outputs.resolved_sha }}
          path: ${{ steps.set_inputs.outputs.resolved_path }}
          position: ${{ steps.set_inputs.outputs.resolved_position }}
          comment-id: ${{ steps.set_inputs.outputs.resolved_comment_id }}
          body: ${{ steps.set_inputs.outputs.resolved_body }}
          body-path: ${{ inputs.body-path }}
          edit-mode: ${{ steps.set_inputs.outputs.resolved_edit_mode }}
          append-separator: ${{ inputs.append-separator || 'newline' }}
          reactions: ${{ steps.set_inputs.outputs.resolved_reactions }}
          reactions-edit-mode: ${{ steps.set_inputs.outputs.resolved_reactions_edit_mode }}